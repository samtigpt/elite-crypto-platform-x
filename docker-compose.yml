# ECPX Local Infrastructure (Foundation)
#
# Services are defined for future milestones but are NOT started in Milestone 0.
# To start later: docker compose up -d
#
# Prerequisites: Docker and Docker Compose installed.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ecpx-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecpx
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ecpx
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecpx -d ecpx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecpx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
