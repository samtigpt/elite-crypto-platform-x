# Elite Score Factor Weights
#
# Placeholder weights for Milestone 0.
# Final values will be tuned and validated during Milestone 6.
#
# All weights should sum to 1.0 (excluding penalties).
# Penalties are applied as negative adjustments after the weighted sum.

version: "0.1"
status: placeholder

weights:
  breakout_strength: 0.20      # Breakout Hunter — resistance break + volume
  multi_tf_alignment: 0.20     # Multi-Timeframe Engine — 4H + 1D confirmation
  momentum: 0.15               # TA Engine — RSI slope, MACD, rate of change
  volume_confirmation: 0.15    # Volume/Liquidity Engine — relative volume
  trend_quality: 0.10          # TA Engine — EMA stack, ADX
  market_regime_fit: 0.10      # Regime Detector — bull/bear/sideways adjustment
  liquidity_score: 0.10      # Volume/Liquidity Engine — spread, depth, volume rank

penalties:
  fake_breakout: -0.15         # Fake Breakout Detector — subtract when detected

# Score clamping
score:
  min: 0
  max: 100

# Tier thresholds (see docs/SCORING.md)
tiers:
  S: { min: 85, max: 100, label: "Elite setup" }
  A: { min: 70, max: 84, label: "High potential" }
  B: { min: 55, max: 69, label: "Watch closely" }
  C: { min: 40, max: 54, label: "Monitor" }
  D: { min: 0, max: 39, label: "Pass" }
